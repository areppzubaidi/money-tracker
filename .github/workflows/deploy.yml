name: Full Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Terraform: provision EC2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply & Capture IP
        id: tf_apply
        run: |
          terraform -chdir=terraform apply -auto-approve | tee tf_output.txt
          # Extract public IP from Terraform output
          IP=$(grep -oP 'public_ip\s*=\s*"\K[^"]+' tf_output.txt | head -1)
          echo "ip=$IP" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 2. Ansible: configure server
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Create inventory file
        run: |
          echo "[money-tracker]" > ansible/inventory.ini
          echo "${{ steps.tf_apply.outputs.ip }} ansible_user=ubuntu ansible_ssh_private_key_file=key.pem" >> ansible/inventory.ini

      - name: Save EC2 private key
        run: echo "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem && chmod 600 key.pem

      - name: Run Ansible playbook
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      # 3. Docker: build and push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/money-tracker:latest

      # 4. Deploy the new container on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ steps.tf_apply.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/money-tracker:latest
            docker stop money-tracker || true
            docker rm money-tracker || true
            docker run -d --name money-tracker -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/money-tracker:latest
